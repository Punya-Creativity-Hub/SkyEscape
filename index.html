<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sky Escape Game</title>

<style>

:root{
  --primary-yellow:#f9c74f;
  --primary-blue:#3a86ff;
  --primary-orange:#f3722c;
  --primary-green:#43aa8b;

  --bg1:#195591;
  --bg2:#243B55;

  --text:rgba(255,255,255,0.92);
  --muted:rgba(255,255,255,0.7);

  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.18);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  overflow-x:hidden;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;

  background:
  linear-gradient(
    135deg,
    var(--bg1),
    var(--bg2)
  );

  font-family:Arial,sans-serif;
}

/* ================= CONTAINER ================= */
.game-wrapper{

  width:95%;
  max-width:720px;

  padding:25px;

  border-radius:30px;

  background:var(--glass);

  border:1px solid var(--border);

  backdrop-filter:blur(15px);

  box-shadow:
  0 15px 40px rgba(0,0,0,0.35),
  inset 0 0 20px rgba(255,255,255,0.05);

  position:relative;

  text-align:center;

  overflow:hidden;
}

/* ================= GLOW ================= */
.glow1,
.glow2{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  z-index:-1;
}

.glow1{
  width:250px;
  height:250px;
  background:var(--primary-blue);
  top:-100px;
  left:-100px;
  opacity:0.35;
}

.glow2{
  width:250px;
  height:250px;
  background:var(--primary-orange);
  bottom:-100px;
  right:-100px;
  opacity:0.3;
}

/* ================= TITLE ================= */
h1{
  color:var(--text);
  font-size:2.6rem;
  margin-bottom:10px;
}

.subtitle{
  color:var(--muted);
  margin-bottom:25px;
  line-height:1.6;
}

/* ================= CANVAS ================= */
.canvas-container{
  position:relative;
  width:100%;
  display:inline-block;
  margin:auto auto 25px;
}

canvas{

  width:100%;
  max-width:100%;
  height:auto;

  border-radius:20px;

  border:2px solid rgba(255,255,255,0.15);

  background:
  linear-gradient(
    to bottom,
    #79d0ff,
    #dff5ff
  );

  box-shadow:
  inset 0 0 20px rgba(255,255,255,0.2),
  0 10px 30px rgba(0,0,0,0.25);

  display:block;

  width:100%;
}

/* ================= LOGO OVERLAY ================= */
.logo-overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:260px;
  height:380px;
  opacity:0.04;
  pointer-events:none;
}
/* ================= BUTTONS ================= */

.controls{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

button{

  padding:14px 30px;

  border:none;
  border-radius:15px;

  cursor:pointer;

  font-size:1rem;
  font-weight:bold;

  color:white;

  transition:0.3s ease;
}

.fly-btn{

  background:
  linear-gradient(
    135deg,
    var(--primary-blue),
    #61a9ff
  );

  box-shadow:
  0 8px 20px rgba(58,134,255,0.4);
}

.reset-btn{

  background:
  linear-gradient(
    135deg,
    var(--primary-orange),
    #ff9b5c
  );

  box-shadow:
  0 8px 20px rgba(243,114,44,0.4);
}

button:hover{
  transform:translateY(-4px) scale(1.03);
}

/* ================= SCORE ================= */

.score-box{

  margin-top:20px;

  display:inline-block;

  padding:12px 22px;

  border-radius:15px;

  background:rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.12);

  color:var(--primary-yellow);

  font-size:1.2rem;
  font-weight:bold;
}

/* ================= INFO ================= */

.info{

  margin-top:20px;

  color:var(--muted);

  line-height:1.8;

  font-size:0.95rem;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  .game-wrapper{
    padding:18px;
    border-radius:22px;
  }

  h1{
    font-size:2rem;
  }

  .subtitle{
    font-size:0.95rem;
  }

  .controls{
    flex-direction:column;
  }

  button{
    width:100%;
  }

  .score-box{
    width:100%;
    font-size:1rem;
  }

  .logo-overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:160px;
  height:220px;
  
}
}

@media(max-width:480px){

  body{
    padding:10px;
    align-items:flex-start;
  }

  .game-wrapper{
    width:100%;
    padding:15px;
    border-radius:20px;
  }

  h1{
    font-size:1.7rem;
  }

  .subtitle{
    font-size:0.85rem;
  }

  .info{
    font-size:0.82rem;
  }

  button{
    font-size:0.95rem;
    border-radius:12px;
  }

  .glow1,
  .glow2{
    width:150px;
    height:150px;
    filter:blur(60px);
  }
}

</style>
</head>

<body>
<!-- <audio src="./File/PCHGAMEAUDIO.mp3" autoplay loop></audio> -->
<div class="game-wrapper">

  <div class="glow1"></div>
  <div class="glow2"></div>

  <h1>Sky Escape</h1>

  <p class="subtitle">
    Collect coins and trophies while escaping dangerous birds
  </p>

  <div class="canvas-container">
    <canvas id="gameCanvas"></canvas>
    <img src="File/Logo.png" alt="Logo" class="logo-overlay">
  </div>

  <div class="controls">

    <button
      class="fly-btn"
      onmousedown="accelerate(-0.25)"
      onmouseup="accelerate(0.06)"
      ontouchstart="accelerate(-0.25)"
      ontouchend="accelerate(0.06)">
      ⬆ FLY
    </button>

    <button class="reset-btn" onclick="resetGame()">
      ⟳ RESET
    </button>

  </div>

  <div class="score-box" id="scoreBox">
    SCORE : 0
  </div>

  <div class="info">
  PCH Games<br>
    Avoid birds and collect rewards.
  </div>

</div>

<!-- ================= AUDIO ================= -->

<audio id="bgMusic" loop>
  <source src="./File/Logo.png" type="audio/mpeg">
</audio>

<audio id="coinSound">
  <source src="./File/Coinaudio1.mp3" type="audio/mpeg">
</audio>

<audio id="gameOver">
  <source src="./File/GameOver.mp3" type="audio/mpeg">
</audio>
<script>

/* ================= CANVAS ================= */

let canvas =
document.getElementById("gameCanvas");

let ctx =
canvas.getContext("2d");

/* ================= AUDIO ================= */

let bgMusic =
document.getElementById("bgMusic");

let coinSound =
document.getElementById("coinSound");

let gameOverSound =
document.getElementById("gameOver");

/* START MUSIC */

document.body.addEventListener(
  "click",
  () => {

    bgMusic.volume = 0.3;

    bgMusic.play();
  },
  { once:true }
);

/* ================= RESPONSIVE ================= */
function resizeCanvas(){

  let wrapper =
  document.querySelector(".game-wrapper");

  let width =
  wrapper.clientWidth - 10;

  if(window.innerWidth < 600){

    canvas.width = width;
    canvas.height = 260;

  }else{

    canvas.width = 600;
    canvas.height = 320;
  }
}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();

/* ================= VARIABLES ================= */

let player;

let birds = [];

let coins = [];

let trophies = [];

let particles = [];

let frameNo = 0;

let score = 0;

let gameInterval;

let gameOver = false;

/* ================= START ================= */

function startGame(){

  player = {

    x:80,
    y:150,

    width:40,
    height:30,

    gravity:0.06,

    gravitySpeed:0
  };

  birds = [];

  coins = [];

  trophies = [];

  particles = [];

  frameNo = 0;

  score = 0;

  gameOver = false;

  clearInterval(gameInterval);

  gameInterval =
  setInterval(updateGame,20);

  // Start background music when game begins
  bgMusic.play();
}

/* ================= UPDATE ================= */

function updateGame(){

  if(gameOver) return;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBackground();

  frameNo++;

  /* CREATE BIRDS */

  if(frameNo == 1 || everyInterval(110)){

    birds.push({

      x:canvas.width,

      y:
      Math.random() * (
      canvas.height - 70
      ) + 20,

      width:42,

      height:30,

      speed:3
    });
  }

  /* CREATE COINS */

  if(everyInterval(140)){

    coins.push({

      x:canvas.width,

      y:
      Math.random() * (
      canvas.height - 60
      ) + 20,

      radius:10
    });
  }

  /* CREATE TROPHIES */

  if(everyInterval(400)){

    trophies.push({

      x:canvas.width,

      y:
      Math.random() * (
      canvas.height - 70
      ) + 20,

      width:28,
      height:28
    });
  }

  /* ================= BIRDS ================= */

  for(let i=0;i<birds.length;i++){

    let bird = birds[i];

    bird.x -= bird.speed;

    drawBird(bird);

    if(checkCollision(player,bird)){

      endGame();
    }
  }

  /* ================= COINS ================= */

  for(let i=0;i<coins.length;i++){

    let coin = coins[i];

    coin.x -= 2.5;

    drawCoin(coin);

    if(checkCircleCollision(player,coin)){

      score += 10;

      coinSound.currentTime = 0;

      coinSound.play();

      createCelebration(
        coin.x,
        coin.y
      );

      coins.splice(i,1);

      i--;
    }
  }

  /* ================= TROPHIES ================= */

  for(let i=0;i<trophies.length;i++){

    let trophy = trophies[i];

    trophy.x -= 3;

    drawTrophy(trophy);

    if(checkCollision(player,trophy)){

      score += 50;

      coinSound.currentTime = 0;

      coinSound.play();

      createCelebration(
        trophy.x,
        trophy.y
      );

      trophies.splice(i,1);

      i--;
    }
  }

  /* ================= PLAYER ================= */

  player.gravitySpeed += player.gravity;

  player.y += player.gravitySpeed;

  if(player.y < 0){

    player.y = 0;
  }

  if(player.y + player.height > canvas.height){

    player.y =
    canvas.height - player.height;

    endGame();
  }

  drawPlayer();

  drawParticles();

  document.getElementById(
    "scoreBox"
  ).innerHTML =
  "SCORE : " + score;
}

/* ================= PLAYER ================= */

function drawPlayer(){

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  /* BODY */

  ctx.fillStyle = "#ff3b30";

  ctx.beginPath();

  ctx.moveTo(0,15);

  ctx.lineTo(28,0);

  ctx.lineTo(40,15);

  ctx.lineTo(28,30);

  ctx.closePath();

  ctx.fill();

  /* WINDOW */

  ctx.fillStyle = "#fff";

  ctx.beginPath();

  ctx.arc(
    20,
    15,
    5,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* FIRE */

  ctx.fillStyle = "#ffb703";

  ctx.beginPath();

  ctx.moveTo(0,10);

  ctx.lineTo(-14,15);

  ctx.lineTo(0,20);

  ctx.closePath();

  ctx.fill();

  /* INNER FIRE */

  ctx.fillStyle = "#ffd166";

  ctx.beginPath();

  ctx.moveTo(-2,12);

  ctx.lineTo(-10,15);

  ctx.lineTo(-2,18);

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}

/* ================= BIRD ================= */

function drawBird(bird){

  ctx.save();

  ctx.translate(
    bird.x,
    bird.y
  );

  ctx.fillStyle = "#222";

  ctx.beginPath();

  ctx.ellipse(
    20,
    15,
    16,
    10,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "#444";

  let flap =
  Math.sin(frameNo * 0.3) * 6;

  ctx.beginPath();

  ctx.moveTo(15,15);

  ctx.lineTo(5,5 + flap);

  ctx.lineTo(18,12);

  ctx.fill();

  ctx.fillStyle = "white";

  ctx.beginPath();

  ctx.arc(
    28,
    12,
    2,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "orange";

  ctx.beginPath();

  ctx.moveTo(35,15);

  ctx.lineTo(42,12);

  ctx.lineTo(42,18);

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}

/* ================= COIN ================= */

function drawCoin(coin){

  ctx.fillStyle = "#f9c74f";

  ctx.beginPath();

  ctx.arc(
    coin.x,
    coin.y,
    coin.radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.strokeStyle = "#fff";

  ctx.lineWidth = 2;

  ctx.stroke();

  ctx.fillStyle = "#fff";

  ctx.font = "bold 12px Arial";

  ctx.fillText(
    "$",
    coin.x - 4,
    coin.y + 4
  );
}

/* ================= TROPHY ================= */

function drawTrophy(t){

  ctx.font = "28px Arial";

  ctx.fillText(
    "🏆",
    t.x,
    t.y + 25
  );
}

/* ================= PARTICLES ================= */

function createCelebration(x,y){

  for(let i=0;i<20;i++){

    particles.push({

      x:x,
      y:y,

      size:
      Math.random() * 6 + 2,

      speedX:
      (Math.random() - 0.5) * 6,

      speedY:
      (Math.random() - 0.5) * 6,

      life:50
    });
  }
}

function drawParticles(){

  for(let i=0;i<particles.length;i++){

    let p = particles[i];

    ctx.fillStyle =
    `hsl(${Math.random()*360},100%,60%)`;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

    p.x += p.speedX;

    p.y += p.speedY;

    p.life--;

    if(p.life <= 0){

      particles.splice(i,1);

      i--;
    }
  }
}

/* ================= BACKGROUND ================= */

function drawBackground(){

  ctx.fillStyle =
  "rgba(255,255,255,0.5)";

  ctx.beginPath();

  ctx.arc(100,70,20,0,Math.PI*2);

  ctx.arc(120,70,25,0,Math.PI*2);

  ctx.arc(145,70,20,0,Math.PI*2);

  ctx.fill();

  ctx.beginPath();

  ctx.arc(350,90,18,0,Math.PI*2);

  ctx.arc(370,90,24,0,Math.PI*2);

  ctx.arc(395,90,18,0,Math.PI*2);

  ctx.fill();
}

/* ================= CONTROLS ================= */

function accelerate(n){

  player.gravity = n;
}

function everyInterval(n){

  return (frameNo / n) % 1 == 0;
}

/* ================= COLLISION ================= */

function checkCollision(a,b){

  return !(

    a.y + a.height < b.y ||

    a.y > b.y + b.height ||

    a.x + a.width < b.x ||

    a.x > b.x + b.width
  );
}

function checkCircleCollision(rect,circle){

  let distX =
  Math.abs(
    circle.x -
    rect.x -
    rect.width/2
  );

  let distY =
  Math.abs(
    circle.y -
    rect.y -
    rect.height/2
  );

  if(
    distX >
    (rect.width/2 + circle.radius)
  ){

    return false;
  }

  if(
    distY >
    (rect.height/2 + circle.radius)
  ){

    return false;
  }

  return true;
}

/* ================= GAME OVER ================= */

function endGame(){

  gameOver = true;

  clearInterval(gameInterval);

  bgMusic.pause();
  bgMusic.currentTime = 0;

  gameOverSound.currentTime = 0;
  gameOverSound.play();

  ctx.fillStyle =
  "rgba(0,0,0,0.5)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "white";

  ctx.font = "bold 45px Arial";

  ctx.fillText(
    "GAME OVER",
    canvas.width/2 - 150,
    canvas.height/2 - 20
  );

  ctx.font = "22px Arial";

  ctx.fillText(
    "Final Score : " + score,
    canvas.width/2 - 80,
    canvas.height/2 + 30
  );
}

/* ================= RESET ================= */

function resetGame(){

  bgMusic.play();

  startGame();
}

/* ================= KEYBOARD ================= */

document.addEventListener(
  "keydown",
  function(e){

    if(e.code === "Space"){

      accelerate(-0.25);
    }
  }
);

document.addEventListener(
  "keyup",
  function(e){

    if(e.code === "Space"){

      accelerate(0.06);
    }
  }
);

/* ================= START ================= */

startGame();

</script>

</body>
</html>
